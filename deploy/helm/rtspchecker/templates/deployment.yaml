kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "plexor.gename" . }}
  labels:
{{ include "plexor.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replica_count }}
  selector:
    matchLabels:
{{ include "plexor.selectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "plexor.labels" . | indent 8 }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ include "plexor.gename" . }}
            topologyKey: "kubernetes.io/hostname"
      restartPolicy: Always
      containers:
      - name: {{ include "plexor.gename" . }}
        image: {{ .Values.imagesVersion }}
        env:
          {{- range $name, $item := .Values.env }}
            - name: {{ $name }}
              {{- $item | toYaml | nindent 14 }}
          {{- end }}
        imagePullPolicy: Always
        {{- if .Values.resources }}
        {{- with .Values.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 8083
          name: http
          protocol: TCP
        - containerPort: 554
          name: rtsp
          protocol: TCP
      #   volumeMounts:
      #     - name: rtspchecker-config
      #       mountPath: "/config"
      #       readOnly: true
      # volumes:
      # - name: rtspchecker-config
      #   secret:
      #     secretName: rtspchecker-config
      #     items:
      #     - key: config-json
      #       path: config.json
      # Tailscale sidecar: shares this pod's network namespace so rtspchecker can reach a
      # camera's tailnet (100.x) address directly, with no cluster-network routing involved.
      - name: tailscale
        image: {{ .Values.tailscaleImage }}
        imagePullPolicy: Always
        env:
          {{- range $name, $item := .Values.tailscaleEnv }}
          - name: {{ $name }}
            {{- $item | toYaml | nindent 12 }}
          {{- end }}
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
